packages:
  - '.'
  - 'web'

# pnpm 10+ refuses to run dependency install scripts unless reviewed here.
# electron and ffmpeg-ffprobe-static download their binaries in postinstall;
# without them there is no Electron to run and packaged builds ship without
# ffmpeg. electron-winstaller (pulled in by electron-builder) is for
# Squirrel installers, which this project doesn't build.
allowBuilds:
  electron: true
  ffmpeg-ffprobe-static: true
  electron-winstaller: false
  ffmpeg-static: set this to true or false
